line-length = 120
target-version = "py312"

[lint]
# E/F/W: erros e estilo básicos; I: ordenação de imports; B: bugbear
# (armadilhas comuns); UP: sintaxe moderna de Python; SIM: simplificações;
# RUF: regras específicas do ruff.
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["src"]

[lint.per-file-ignores]
# dashboard/app.py precisa inserir a raiz do projeto no sys.path antes de
# importar módulos de src/, então os imports não podem ficar todos no topo.
"dashboard/app.py" = ["E402"]
